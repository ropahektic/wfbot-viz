<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFbot viz</title>
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --line: #252a31; --text: #c9ced6; --dim: #6b7380;
    --land: #3b5a3c; --water: #1b3a57; --me: #4fc3ff; --enemy: #ff5d5d; --friend: #57d18c;
    --walk: #e8e8e8; --water-hi: #9fd4ff; --chute: #6fe3ff; --shot: #ffb347; --blast: #ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header b { letter-spacing: .08em; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .dot.on { background: #4cd964; box-shadow: 0 0 6px #4cd964; }
  .sp { flex: 1; }
  header span { color: var(--dim); }
  button, input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: inherit; }
  button:hover { border-color: var(--dim); cursor: pointer; }
  input { width: 64px; }
  main { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; }
  #wrap { position: relative; width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0b0c0f; }
  canvas { display: block; width: 100%; height: auto; }
  #idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  summary { padding: 6px 10px; cursor: pointer; color: var(--dim); user-select: none; }
  summary b { color: var(--text); font-weight: 500; }
  .body { padding: 0 10px 8px; white-space: pre-wrap; }
  #log { max-height: 180px; overflow: auto; color: var(--dim); }
  #log div:last-child { color: var(--text); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div><b>WFBOT</b><span id="meta">offline</span>
  <div class="sp"></div>
  <button id="replay" title="replay the plan">replay</button>
  <label><span>port</span> <input id="port" value="8765"></label>
</header>
<main>
  <div id="wrap"><canvas id="cv" width="1920" height="696"></canvas><div id="idle">waiting for the bot…</div></div>
  <details open><summary>decision — <b id="dec">—</b></summary><div class="body" id="plan"></div></details>
  <details><summary>thinking</summary><div class="body" id="log"></div></details>
  <details><summary>legend</summary><div class="body legend">
    <span><i style="background:none;border:2px solid #fff"></i>turn worm</span><span><i style="background:#ff5d5d"></i><i style="background:#4fc3ff"></i><i style="background:#57d18c"></i>teams</span>
    <span><i style="background:none;border:2px solid #d33"></i>mine</span><span><i style="background:#e8d9a8"></i>rope</span><span><i style="background:var(--walk)"></i>walk / jump</span>
    <span><i style="background:var(--chute)"></i>chute</span><span><i style="background:var(--shot)"></i>shot</span>
    <span><i style="background:var(--blast)"></i>blast</span>
  </div></details>
</main>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let turn = null, plan = null, land = null, anim = 0, es = null;
let geo = null, ents = null, entsAt = 0, trails = new Map(), turnWorm = 0;
const TEAMS = ['#ff5d5d', '#4fc3ff', '#57d18c', '#f7d154', '#c78bff', '#ff9f43'];
const teamColor = t => TEAMS[t % TEAMS.length];

function connect() {
  if (es) es.close();
  const port = $('port').value || 8765;
  const base = location.port === String(port) ? '' : `http://127.0.0.1:${port}`;
  es = new EventSource(`${base}/events`);
  es.onopen = () => $('dot').classList.add('on');
  es.onerror = () => { $('dot').classList.remove('on'); $('meta').textContent = 'offline'; };
  es.onmessage = e => { try { on(JSON.parse(e.data)); } catch (_) {} };
}

function on(m) {
  if (m.type === 'map') {
    geo = m; land = terrain(m); $('idle').style.display = 'none'; if (!anim) draw();
  } else if (m.type === 'ents') {
    ents = m; entsAt = performance.now();
    const me = m.worms.find(w => w[5]);
    if (me && me[0] !== turnWorm) { turnWorm = me[0]; trails.clear(); }
    for (const w of m.worms) if (w[5]) track(w[0], w[1], w[2]);
    for (const q of m.proj) track(q[0], q[1], q[2]);
    $('meta').textContent = `${turn ? turn.mode + ' · ' : ''}frame ${m.t} · wind ${m.wind > 0 ? '→' : m.wind < 0 ? '←' : '·'} ${Math.abs(m.wind).toFixed(2)}`;
    if (!anim) draw();
  } else if (m.type === 'turn') {
    turn = m; plan = null; geo = m;
    $('idle').style.display = 'none';
    $('log').innerHTML = ''; $('dec').textContent = 'thinking…'; $('plan').textContent = '';
    land = terrain(m); draw();
  } else if (m.type === 'log') {
    const d = document.createElement('div'); d.textContent = m.text; $('log').appendChild(d);
    $('log').scrollTop = 1e9;
  } else if (m.type === 'plan') {
    plan = m; $('dec').textContent = m.text.split('\n')[0]; $('plan').textContent = m.text.split('\n').slice(1).join('\n');
    play();
  }
}

function terrain(m) {
  const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
  const g = c.getContext('2d'), img = g.createImageData(m.cw, m.ch), raw = atob(m.map);
  const [r, gr, b] = hex(css('--land'));
  for (let i = 0; i < m.cw * m.ch; i++) {
    if (raw.charCodeAt(i >> 3) >> (i & 7) & 1) { const o = i * 4; img.data[o] = r; img.data[o+1] = gr; img.data[o+2] = b; img.data[o+3] = 255; }
  }
  const t = document.createElement('canvas'); t.width = m.cw; t.height = m.ch; t.getContext('2d').putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, m.w, m.h);
  return c;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

function track(id, x, y) {
  let t = trails.get(id); if (!t) trails.set(id, t = []);
  const l = t[t.length - 1]; if (!l || l[0] !== x || l[1] !== y) t.push([x, y]);
  if (t.length > 600) t.shift();
}

function draw() {
  if (!geo) return;
  cv.width = geo.w; cv.height = geo.h;
  ctx.fillStyle = css('--water'); ctx.fillRect(0, geo.water, geo.w, geo.h - geo.water);
  ctx.drawImage(land, 0, 0);
  if (ents && performance.now() - entsAt < 3000) drawLive(); else if (turn) drawTurn();
  if (plan && turn) drawPlan();
}

// the live game (every mode): team-coloured worms, the turn worm ringed with its trail, rope,
// chute canopy, projectiles with their trails, mines, drums, crates
function drawLive() {
  const e = ents;
  for (const [x, y] of e.mines) dotAt(x, y, 4, '#d33', true);
  for (const [x, y] of e.drums) { ctx.fillStyle = '#c97a2b'; ctx.fillRect(x - 8, y - 12, 16, 22); }
  for (const [x, y] of e.crates) { ctx.strokeStyle = '#e6c84f'; ctx.lineWidth = 2; ctx.strokeRect(x - 10, y - 18, 20, 24); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [id, t] of trails) {
    if (t.length < 2) continue;
    const isProj = !e.worms.some(w => w[0] === id);
    ctx.strokeStyle = isProj ? css('--shot') + '99' : '#ffffff55'; ctx.lineWidth = 2;
    ctx.setLineDash(isProj ? [2, 4] : []);
    ctx.beginPath(); ctx.moveTo(t[0][0], t[0][1]); for (const p of t) ctx.lineTo(p[0], p[1]); ctx.stroke();
  }
  ctx.setLineDash([]);
  if (e.rope.length > 1) {
    ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(e.rope[0][0], e.rope[0][1]); for (const p of e.rope) ctx.lineTo(p[0], p[1]); ctx.stroke();
    dotAt(e.rope[0][0], e.rope[0][1], 3, '#e8d9a8');
  }
  for (const [id, x, y, team, st, on] of e.worms) {
    if (st === 0x7D) canopy(x, y);
    dotAt(x, y, 9, teamColor(team));
    if (on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.stroke(); }
  }
  for (const [, x, y] of e.proj) dotAt(x, y, 5, css('--shot'));
}

function drawTurn() {
  for (const [x, y] of turn.mines) dotAt(x, y, 4, '#d33', true);
  for (const [x, y] of turn.drums) { ctx.fillStyle = '#c97a2b'; ctx.fillRect(x - 8, y - 12, 16, 22); }
  for (const [x, y] of turn.crates) { ctx.strokeStyle = '#e6c84f'; ctx.lineWidth = 2; ctx.strokeRect(x - 10, y - 18, 20, 24); }
  const flying = plan && plan.blast && (tick < 0 || tick >= plan.blast[3]) ? plan.flights.map(f => f.pts[0]) : [];
  for (const [x, y, k] of turn.worms) {
    if (flying.some(p => Math.abs(p[0] - x) < 2 && Math.abs(p[1] - y) < 2)) continue;
    dotAt(x, y, 9, css(k === 'enemy' ? '--enemy' : '--friend'));
  }
  if (!plan || !plan.route.length) dotAt(turn.me[0], turn.me[1], 10, css('--me'));
}

function dotAt(x, y, r, c, ring) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (ring) { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.stroke(); } else { ctx.fillStyle = c; ctx.fill(); }
}

// the plan as a timeline in game ticks: the worm along its route (canopy while chuting), the
// shot, the blast, the enemies flying along their arcs (splash when they drown)
const SPEED = 2;  // ticks per animation frame (~2x game speed)
let tick = -1;
function at(pts, t, ti) {  // position at tick t on points carrying their tick at index ti
  if (!pts.length) return null;
  if (t <= pts[0][ti]) return [pts[0], 0];
  for (let i = 1; i < pts.length; i++) if (pts[i][ti] >= t) {
    const a = pts[i-1], b = pts[i], f = (t - a[ti]) / Math.max(1, b[ti] - a[ti]);
    return [[a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, b[2]], i];
  }
  return [pts[pts.length - 1], pts.length];
}
function planEnd() {
  if (!plan) return 0;
  const r = plan.route, b = plan.blast, fl = Math.max(0, ...plan.flights.map(f => f.pts.length));
  return Math.max(r.length ? r[r.length-1][3] : 0, b ? b[3] + fl + 40 : plan.shot_t0 + plan.shot.length * plan.shot_dt);
}
function drawPlan() {
  const r = plan.route, t = tick < 0 ? 1e9 : tick;
  // the whole route, faint; walked part, bright
  ctx.lineCap = 'round';
  for (let i = 1; i < r.length; i++) {
    const k = r[i][2], done = r[i][3] <= t;
    ctx.strokeStyle = css(k === 'chute' ? '--chute' : '--walk') + (done ? '' : '44');
    ctx.lineWidth = done ? 3 : 2;
    ctx.setLineDash(k === 'jump' || k === 'fall' ? [3, 6] : []);
    ctx.beginPath(); ctx.moveTo(r[i-1][0], r[i-1][1]); ctx.lineTo(r[i][0], r[i][1]); ctx.stroke();
  }
  ctx.setLineDash([]);
  // the worm
  const w = at(r, t, 3);
  if (w) {
    const [[x, y, k]] = w;
    if (k === 'chute') canopy(x, y);
    if (k === 'crouch') { ctx.fillStyle = css('--me'); ctx.beginPath(); ctx.ellipse(x, y + 3, 11, 7, 0, 0, 7); ctx.fill(); }
    else dotAt(x, y, 10, css('--me'));
  }
  // the shot
  const s = plan.shot, st = (t - plan.shot_t0) / plan.shot_dt;
  if (s.length && st >= 0) {
    const n = Math.min(s.length - 1, Math.floor(st));
    ctx.strokeStyle = css('--shot'); ctx.setLineDash(plan.weapon === 'Grenade' ? [2, 5] : []); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); for (let i = 1; i <= n; i++) ctx.lineTo(s[i][0], s[i][1]); ctx.stroke(); ctx.setLineDash([]);
    if (!plan.blast || t < plan.blast[3]) {
      const q = s[n];
      if (plan.weapon === 'Grenade') dotAt(q[0], q[1], 5, css('--shot'));
      else { const p = s[Math.max(0, n - 1)], a = Math.atan2(q[1] - p[1], q[0] - p[0]);
        ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(a); ctx.fillStyle = css('--shot'); ctx.fillRect(-7, -3, 14, 6); ctx.restore(); }
    }
  }
  // the blast and the flights
  const b = plan.blast;
  if (b && t >= b[3]) {
    const bt = t - b[3], [x, y, rad] = b;
    const flash = Math.max(0, 1 - bt / 30);
    ctx.fillStyle = css('--blast') + hx2(0x22 + flash * 0x99); ctx.beginPath(); ctx.arc(x, y, rad * (0.6 + 0.4 * Math.min(1, bt / 6)), 0, 7); ctx.fill();
    ctx.strokeStyle = css('--blast'); ctx.lineWidth = 2; ctx.stroke();
    for (const f of plan.flights) {
      const p = f.pts, n = Math.min(p.length - 1, bt);
      ctx.strokeStyle = css('--enemy'); ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i <= n; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.stroke(); ctx.setLineDash([]);
      const q = p[n];
      if (f.drowned && n === p.length - 1) splash(q[0], turn.water, bt - (p.length - 1));
      else dotAt(q[0], q[1], 9, css('--enemy'));
    }
  } else if (b) {
    // before the blast: where they will go, faint
    for (const f of plan.flights) {
      ctx.strokeStyle = css('--enemy') + '33'; ctx.lineWidth = 1; ctx.setLineDash([2, 6]);
      ctx.beginPath(); ctx.moveTo(f.pts[0][0], f.pts[0][1]); for (const q of f.pts) ctx.lineTo(q[0], q[1]); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}
const hx2 = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
function canopy(x, y) {
  ctx.strokeStyle = css('--chute'); ctx.fillStyle = css('--chute') + '55'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y - 26, 18, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 18, y - 26); ctx.lineTo(x, y - 6); ctx.lineTo(x + 18, y - 26); ctx.stroke();
}
function splash(x, y, k) {
  const a = Math.max(0, 1 - k / 60);
  ctx.strokeStyle = css('--water-hi') + hx2(255 * a); ctx.lineWidth = 2;
  for (const r of [8, 16, 24]) { ctx.beginPath(); ctx.ellipse(x, y, r + k * 0.4, (r + k * 0.4) / 3, 0, 0, 7); ctx.stroke(); }
  ctx.fillStyle = css('--enemy') + hx2(255 * a); ctx.font = 'bold 18px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText('✕', x, y - 14);
}

function play() {
  cancelAnimationFrame(anim);
  const end = planEnd(); tick = 0;
  const step = () => { tick += SPEED; draw(); if (tick < end) anim = requestAnimationFrame(step); else { anim = 0; tick = -1; draw(); } };
  anim = requestAnimationFrame(step);
}

$('replay').onclick = () => plan && play();
$('port').onchange = () => { localStorage.port = $('port').value; connect(); };
$('port').value = localStorage.port || 8765;
connect();
</script>
</body>
</html>
